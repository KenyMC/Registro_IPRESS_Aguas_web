    <script>
      // Detección y auto-recuperación de caché antigua/corrupta
      window.addEventListener('error', function(e) {
        var msg = String(e && (e.message || e.error || e) || '');
        if (msg.indexOf('trim is not a function') !== -1 || msg.indexOf('ChunkLoadError') !== -1) {
          if (!sessionStorage.getItem('reloaded_on_err')) {
            sessionStorage.setItem('reloaded_on_err', '1');
            if ('caches' in window) {
              caches.keys().then(function(k) { k.forEach(function(n) { caches.delete(n); }); });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(r) { r.forEach(function(s) { s.unregister(); }); });
            }
            setTimeout(function() { window.location.reload(); }, 300);
          }
        }
      });
    </script>
    <script>
      // En localhost (desarrollo), desactivar cualquier Service Worker previo que pueda bloquear el CSS
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
      }
    </script>
